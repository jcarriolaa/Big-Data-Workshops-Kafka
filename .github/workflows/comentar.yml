# Publica en el PR el resultado que dejó validar.yml.
#
# Va aparte porque los PR desde un fork no tienen permiso de escritura. Este
# workflow corre en el contexto del repo del curso y NUNCA ejecuta código del
# fork: solo lee un archivo de texto que ya se generó.
name: Comentar validación

on:
  workflow_run:
    workflows: ["Validar entrega"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comentar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resultado-validacion
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = parseInt(fs.readFileSync('numero-pr.txt', 'utf8').trim());
            if (!pr) { core.info('Sin número de PR; no hay nada que comentar.'); return; }

            const marca = '<!-- validar-entrega -->';
            const cuerpo = marca + '\n' + fs.readFileSync('resultado.md', 'utf8');

            // Si ya comenté antes en este PR, edito ese comentario en vez de
            // llenar el hilo de mensajes repetidos.
            const previos = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr,
            });
            const mio = previos.data.find(c => c.body.includes(marca));
            if (mio) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mio.id, body: cuerpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr, body: cuerpo,
              });
            }
