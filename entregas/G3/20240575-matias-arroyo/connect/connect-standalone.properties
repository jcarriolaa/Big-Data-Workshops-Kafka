# Worker de Kafka Connect en modo standalone (un solo proceso).
# Referencia: https://kafka.apache.org/documentation/#connectconfigs

# Connect corre dentro de Docker: usa la direccion INTERNAL de los brokers.
bootstrap.servers=kafka1:19092,kafka2:19092,kafka3:19092

# El productor manda la clave (tienda) como texto y el valor como JSON plano,
# sin el sobre {"schema":...,"payload":...} que espera el JsonConverter por
# defecto. Con StringConverter Connect pasa cada mensaje tal cual, y el archivo
# queda con un evento JSON por linea.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter

# En standalone Connect recuerda por donde va en un archivo local.
offset.storage.file.filename=/connect/connect.offsets
offset.flush.interval.ms=5000

# En Kafka 4 el conector FileStream viene en la imagen pero fuera del
# classpath: hay que decirle a Connect donde esta el JAR.
plugin.path=/opt/kafka/libs/connect-file-4.3.1.jar
