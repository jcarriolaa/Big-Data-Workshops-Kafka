# Worker standalone: direcciones internas a la red de Docker.
bootstrap.servers=kafka1:19092,kafka2:19092,kafka3:19092
# Los eventos del productor son bytes JSON planos, sin envoltura de schema.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter
offset.storage.file.filename=/work/connect/connect.offsets
offset.flush.interval.ms=10000
# Kafka 4 incluye el JAR, pero Connect no lo descubre sin plugin.path.
plugin.path=/opt/kafka/libs/connect-file-4.3.1.jar
consumer.auto.offset.reset=earliest
