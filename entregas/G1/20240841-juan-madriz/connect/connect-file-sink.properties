# Conector que vuelca el topic a un archivo. Solo configuracion, sin codigo.

name=ventas-file-sink
connector.class=org.apache.kafka.connect.file.FileStreamSinkConnector
tasks.max=1

topics=ventas-G1

# La carpeta esta montada desde ./connect, asi que sale como connect/ventas.txt
file=/opt/kafka/connect-config/ventas.txt
