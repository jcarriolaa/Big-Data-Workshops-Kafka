# Worker de Connect en modo standalone.

bootstrap.servers=kafka1:19092,kafka2:19092,kafka3:19092

# El productor manda JSON plano y el JsonConverter por defecto espera
# {"schema":...,"payload":...}, asi que con StringConverter pasa tal cual.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter

offset.storage.file.filename=/opt/kafka/connect-config/connect.offsets
offset.flush.interval.ms=10000

plugin.path=/opt/kafka/plugins
